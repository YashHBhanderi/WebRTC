<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Support · Chat</title>
    <style>
      /* Your app's own identity: SpreeWe components inherit the font and use your brand colour */
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; --sw-color-brand: light-dark(#5b3cc4, #b7a6f5); --sw-bubble-out: light-dark(#5b3cc4, #4a3a8c); }
      body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr; background: Canvas; color: CanvasText; }
      header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #8884; }
      header strong { flex: 1; }
      main { padding: 16px; min-height: 0; }
      spreewe-chat { height: 100%; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <header>
      <strong>Acme Support</strong>
      <span id="status"></span>
      <button id="signin">Sign in with SpreeWe</button>
      <button id="signout" class="hidden">Sign out</button>
    </header>
    <main>
      <spreewe-provider id="provider" theme="inherit">
        <spreewe-chat id="chat"></spreewe-chat>
      </spreewe-provider>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
