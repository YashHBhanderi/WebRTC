<div class="login-page">
    <div class="form-side">
        <div class="form-wrapper">
            <div class="text-center mb-5">
                <img src="../../../assets/doge.png" class="logo mb-3" alt="Logo" />
                <h2 class="fw-bold text-dark">Welcome Back</h2>
                <p class="text-muted">Sign in to continue to your chats</p>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="mb-3">
                    <label for="email-input" class="form-label fw-semibold">Email</label>
                    <input type="email" id="email-input" formControlName="email" class="form-control"
                        placeholder="you@example.com" />
                    <div *ngIf="hasError('email','required')" class="text-danger small mt-1">*Email is required</div>
                    <div *ngIf="hasError('email','email')" class="text-danger small mt-1">*Invalid email format</div>
                </div>

                <div class="mb-4">
                    <label for="password-input" class="form-label fw-semibold">Password</label>
                    <input type="password" id="password-input" formControlName="password" class="form-control"
                        placeholder="Enter your password" />
                    <div *ngIf="hasError('password','required')" class="text-danger small mt-1">*Password is required
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2" [disabled]="loginForm.invalid || loading">
                    <span *ngIf="!loading">Sign In</span>
                    <span *ngIf="loading">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        Signing in...
                    </span>
                </button>
            </form>

            <p class="text-center mt-4 text-muted">
                Don’t have an account? <a routerLink="/auth/register"
                    class="text-decoration-none fw-semibold register-link">Sign Up</a>
            </p>
        </div>
    </div>
    <div class="image-side d-none d-md-block"></div>
</div>
