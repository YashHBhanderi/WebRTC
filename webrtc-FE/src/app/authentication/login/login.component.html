<div class="login-page">
    <div class="form-side">
        <div class="form-wrapper">
            <!-- <div class="text-center mb-4">
                <img src="../../../assets/Group-2186.webp" class="logo" alt="Logo" />
            </div> -->

            <div class="auth-head">
                <a routerLink="/" class="auth-head__home"><i class="ti ti-arrow-left" aria-hidden="true"></i> SpreeWe home</a>
                <span class="auth-head__portal" [class.auth-head__portal--dev]="portal === 'developer'">
                    <i class="ti" [ngClass]="portal === 'developer' ? 'ti-code' : 'ti-message-circle'" aria-hidden="true"></i>
                    {{ portal === 'developer' ? 'Developer Portal' : 'SpreeWe app' }}
                </span>
            </div>

            <!-- Clerk's sign-in (email code / password / social, as enabled in the Clerk dashboard) -->
            <div #mount class="clerk-mount"></div>

            <div class="auth-unavailable" *ngIf="unavailable" role="alert">
                <p class="fw-semibold mb-1">Sign-in is unavailable</p>
                <p class="text-muted small mb-3">{{ unavailable }}</p>
                <button type="button" class="btn btn-primary btn-sm" (click)="retry()">Try again</button>
            </div>
        </div>
    </div>
    <!-- <div class="image-side d-none d-md-block"></div> -->
</div>
