<div class="register-page">
    <div class="image-side"></div>

    <div class="form-side">
        <div class="register-container card p-4 p-md-5">
            <div class="text-center mb-4">
                <img src="../../../assets/doge.png" alt="Logo" class="logo mb-3" />
                <h2 class="mb-0 text-primary">Register</h2>
            </div>

            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                <div class="form-group mt-3">
                    <label for="username" class="form-label">User Name</label>
                    <input type="text" formControlName="username" class="form-control" id="username"
                        placeholder="Enter username" />
                    <div *ngIf="hasError('username', 'required')" class="text-danger small">
                        *username is required
                    </div>
                    <div *ngIf="hasError('username', 'minlength')" class="text-danger small">
                        *username must be at least 3 characters long
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="text" formControlName="email" class="form-control" id="email"
                        placeholder="Enter E-mail" />
                    <div *ngIf="hasError('email', 'required')" class="text-danger small">
                        *E-mail is required
                    </div>
                    <div *ngIf="hasError('email', 'email')" class="text-danger small">
                        *Invalid email format
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" formControlName="password" class="form-control" id="password"
                        placeholder="Password" />
                    <div *ngIf="hasError('password', 'required')" class="text-danger small">
                        *Password is required
                    </div>
                    <div *ngIf="hasError('password', 'minlength')" class="text-danger small">
                        *Password must be at least 6 characters long
                    </div>
                </div>

                <div class="form-group mt-3">
                    <label for="avatar" class="form-label">Profile Picture</label>
                    <input type="file" (change)="onFileSelected($event)" formControlName="avatar" class="form-control"
                        id="avatar" />
                    <div *ngIf="avatarPreview" class="mt-2">
                        <img [src]="avatarPreview" class="rounded-circle shadow-sm" width="90" height="90"
                            alt="Avatar Preview" />
                    </div>
                    <div *ngIf="hasError('avatar', 'required')" class="text-danger small">
                        *Profile picture is required
                    </div>
                </div>

                <button type="submit"
                    class="btn btn-primary w-100 py-2 mt-4 d-flex justify-content-center align-items-center"
                    style="background: linear-gradient(45deg, #6366f1, #8b5cf6); border: none;" [disabled]="loading">
                    <span *ngIf="!loading">Register</span>
                    <span *ngIf="loading" class="d-flex align-items-center">
                        <span class="spinner-border spinner-border-sm text-light me-2" role="status"
                            aria-hidden="true"></span>
                        Signing Up...
                    </span>
                </button>
            </form>

            <div class="text-center mt-3">
                <p class="mb-0">
                    Already have an account?
                    <a routerLink="/auth/login" class="text-purple-300">Login Here</a>
                </p>
            </div>
        </div>
    </div>
</div>
