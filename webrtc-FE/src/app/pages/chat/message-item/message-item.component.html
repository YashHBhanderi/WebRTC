<div
  class="msg-row"
  [class.msg-row--mine]="mine"
  [class.msg-row--first]="first"
  [class.msg-row--highlight]="highlighted"
  [class.msg-row--hit]="searchHit"
  [class.msg-row--reacted]="reactions.length > 0"
  [class.msg-row--active]="stripPinned || menuOpen || pickerOpen"
  [class.msg-row--compact]="compact"
  [attr.data-message-id]="message._id"
  (mouseenter)="onHover()"
>
  <button
    type="button"
    class="msg-row__avatar"
    *ngIf="!mine"
    (click)="avatarClick.emit(senderId)"
    [attr.aria-label]="'View ' + senderName"
    tabindex="-1"
  >
    <app-avatar [src]="senderAvatar" [name]="senderName" [size]="compact ? 26 : 32"></app-avatar>
  </button>

  <div class="msg-row__body">
    <span class="swipe-cue" #swipeIcon aria-hidden="true"><i class="fa-solid fa-reply"></i></span>

    <div class="bubble" #bubble (appLongPress)="onLongPress()" [class.bubble--footer]="hasFooterFlags" [class.bubble--call]="!!message.call">
      <span class="bubble__sender" *ngIf="isGroup && !mine && first">{{ senderName }}</span>

      <button type="button" class="bubble__quote" *ngIf="message.replyTo && (message.replyTo.content || message.replyTo.type)" (click)="quoteClick.emit(message.replyTo._id)">
        <span class="bubble__quote-author">{{ replyAuthor }}</span>
        <span class="bubble__quote-text">{{ quoteText }}</span>
      </button>

      <div class="bubble__media-wrap" *ngIf="message.type === 'image' || message.type === 'video'">
        <button type="button" class="bubble__media" *ngIf="message.type === 'image'" (click)="openFile('image')" aria-label="Open image">
          <img [src]="message.thumbnailUrl || message.fileUrl" alt="Shared image" loading="lazy" />
        </button>
        <video *ngIf="message.type === 'video'" class="bubble__video" controls preload="metadata"
          [poster]="message.thumbnailUrl && message.thumbnailUrl !== message.fileUrl ? message.thumbnailUrl : null">
          <source [src]="message.fileUrl" />
        </video>
        <a *ngIf="downloadHref" class="bubble__download bubble__download--overlay" [href]="downloadHref" [attr.target]="downloadTarget"
          rel="noopener" download [attr.aria-label]="'Download ' + fileName()" [title]="'Download ' + fileName()">
          <i class="fa-solid fa-download"></i>
        </a>
      </div>
      <div class="bubble__file-row" *ngIf="message.type === 'audio'">
        <audio class="bubble__audio" controls preload="metadata">
          <source [src]="message.fileUrl" />
        </audio>
        <a *ngIf="downloadHref" class="bubble__download" [href]="downloadHref" [attr.target]="downloadTarget"
          rel="noopener" download [attr.aria-label]="'Download ' + fileName()" [title]="'Download ' + fileName()">
          <i class="fa-solid fa-download"></i>
        </a>
      </div>
      <div class="bubble__file-row" *ngIf="message.type === 'pdf'">
        <button type="button" class="bubble__doc" (click)="openFile('pdf')" [title]="'Open ' + fileName()">
          <i class="fa-solid fa-file-pdf"></i>
          <span class="bubble__doc-name">{{ fileName() }}<small class="bubble__doc-size" *ngIf="message.fileSize">{{ message.fileSize | fileSize }}</small></span>
          <i class="fa-solid fa-eye bubble__doc-open"></i>
        </button>
        <a *ngIf="downloadHref" class="bubble__download" [href]="downloadHref" [attr.target]="downloadTarget"
          rel="noopener" download [attr.aria-label]="'Download ' + fileName()" [title]="'Download ' + fileName()">
          <i class="fa-solid fa-download"></i>
        </a>
      </div>

      <!-- Finished call (connected calls only) -->
      <div class="bubble__call" *ngIf="message.call">
        <span class="bubble__call-icon" aria-hidden="true">
          <i class="fa-solid" [class.fa-video]="message.call.callType === 'video'" [class.fa-phone]="message.call.callType !== 'video'"></i>
          <i class="fa-solid bubble__call-dir" *ngIf="message.call.mode !== 'meetNow'" [class.fa-arrow-up]="mine" [class.fa-arrow-down]="!mine"></i>
        </span>
        <span class="bubble__call-text">
          <strong>{{ callLabel }}</strong>
          <span>{{ callDuration }}</span>
        </span>
      </div>

      <div class="bubble__file-row" *ngIf="message.type === 'file'">
        <a class="bubble__doc" [href]="downloadHref" [attr.target]="downloadTarget" rel="noopener" download [title]="'Download ' + fileName()">
          <i class="fa-solid {{ fileIcon() }}"></i>
          <span class="bubble__doc-name">{{ fileName() }}<small class="bubble__doc-size" *ngIf="message.fileSize">{{ message.fileSize | fileSize }}</small></span>
          <i class="fa-solid fa-download bubble__doc-open"></i>
        </a>
      </div>

      <app-recording-card *ngIf="message.type === 'recording' && message.recording" [recordingId]="message.recording.recordingId" [fallbackTitle]="message.content || ''"></app-recording-card>

      <p class="bubble__text" *ngIf="hasText; else metaRow">
        <ng-container *ngIf="searchHit && searchTerm; else plain"><span [innerHTML]="visibleText | highlight: searchTerm"></span></ng-container>
        <ng-template #plain><ng-container *ngIf="mentionNames.length; else rawText"><span [innerHTML]="mentionHtml"></span></ng-container></ng-template>
        <ng-template #rawText>{{ visibleText }}</ng-template>
        <button type="button" class="read-more" *ngIf="isLong" (click)="toggleExpanded($event)">{{ expanded ? 'Read less' : 'Read more' }}</button>
        <span class="bubble__spacer" *ngIf="!hasFooterFlags" [class.bubble__spacer--tick]="showTicks" aria-hidden="true"></span>
      </p>
      <ng-template #metaRow><div class="bubble__meta-row" *ngIf="!hasFooterFlags" aria-hidden="true"></div></ng-template>

      <span class="bubble__meta">
        <span class="bubble__flags" *ngIf="pinned || message.saved">
          <i *ngIf="pinned" class="fa-solid fa-thumbtack bubble__flag" aria-label="Pinned" title="Pinned"></i>
          <i *ngIf="message.saved" class="fa-solid fa-bookmark bubble__flag" aria-label="Saved" title="Saved"></i>
        </span>
        <span class="bubble__edited" *ngIf="message.editedAt" [title]="'Edited ' + (message.editedAt | date: 'medium')">Edited</span>
        <time [attr.datetime]="message.createdAt" [title]="message.createdAt | date: 'medium'">{{ message.createdAt | date: 'shortTime' }}</time>
        <i *ngIf="showTicks" class="fa-solid tick"
           [class.fa-check-double]="message.status === 'seen' || message.status === 'delivered'"
           [class.fa-check]="!message.status || message.status === 'sent'"
           [class.tick--read]="message.status === 'seen'"
           role="img" [attr.aria-label]="statusLabel" [title]="statusLabel"></i>
      </span>
    </div>

    <div class="reactions" *ngIf="reactions.length">
      <button type="button" *ngFor="let r of reactions" class="reaction" [class.reaction--mine]="r.mine" (click)="react.emit(r.emoji)" [attr.aria-label]="r.emoji + ' ' + r.count">
        {{ r.emoji }}<span *ngIf="r.count > 1">{{ r.count }}</span>
      </button>
    </div>

    <ng-container *ngIf="!compact">
      <!-- Hover/long-press action strip: 4 quick reactions · more · reply · menu -->
      <div class="strip" [class.strip--below]="stripBelow" role="toolbar" aria-label="Message actions">
        <button type="button" class="strip__emoji" *ngFor="let e of quickReactions" (click)="sendReaction(e)" [attr.aria-label]="'React ' + e">{{ e }}</button>
        <button type="button" class="strip__btn" #plusBtn (click)="openPicker(plusBtn)" aria-label="More reactions" title="More reactions">
          <i class="fa-solid fa-plus"></i>
        </button>
        <span class="strip__sep" aria-hidden="true"></span>
        <button type="button" class="strip__btn" (click)="onReply()" aria-label="Reply" title="Reply">
          <i class="fa-solid fa-reply"></i>
        </button>
        <div ngbDropdown [placement]="menuPlacement" container="body" (openChange)="onMenuOpenChange($event)">
          <button type="button" class="strip__btn" ngbDropdownToggle aria-label="More options" title="More">
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>
          <div ngbDropdownMenu class="app-menu app-menu--message">
            <button ngbDropdownItem type="button" (click)="onReply()"><i class="fa-solid fa-reply"></i>Reply</button>
            <button ngbDropdownItem type="button" *ngIf="canEdit" (click)="edit.emit(message)"><i class="fa-solid fa-pen"></i>Edit</button>
            <button ngbDropdownItem type="button" *ngIf="hasText" (click)="copy.emit(message)"><i class="fa-regular fa-copy"></i>Copy text</button>
            <button ngbDropdownItem type="button" (click)="copyLink.emit(message)"><i class="fa-solid fa-link"></i>Copy link</button>
            <a ngbDropdownItem *ngIf="downloadHref" [href]="downloadHref" [attr.target]="downloadTarget" rel="noopener" download><i class="fa-solid fa-download"></i>Download</a>
            <button ngbDropdownItem type="button" (click)="forward.emit(message)"><i class="fa-solid fa-share"></i>Forward</button>
            <button ngbDropdownItem type="button" (click)="togglePin.emit(message)"><i class="fa-solid fa-thumbtack"></i>{{ pinned ? 'Unpin' : 'Pin' }}</button>
            <button ngbDropdownItem type="button" (click)="toggleSave.emit(message)"><i class="fa-regular fa-bookmark"></i>{{ message.saved ? 'Remove from saved' : 'Save' }}</button>
            <ng-container *ngIf="mine">
              <div class="dropdown-divider"></div>
              <button ngbDropdownItem type="button" class="text-danger" (click)="remove.emit(message)"><i class="fa-regular fa-trash-can"></i>Delete</button>
            </ng-container>
          </div>
        </div>
      </div>

    </ng-container>
  </div>
</div>

<app-emoji-picker *ngIf="pickerOpen" [anchor]="pickerAnchor" (picked)="onPicked($event)" (closed)="closePicker()"></app-emoji-picker>
