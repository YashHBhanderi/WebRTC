<div class="modal-body p-0 profile-hub">
    <!-- Main Content -->
    <ng-container *ngIf="user">
        <div class="profile-header p-4 text-center text-white pb-5" [style.background-color]="'#038edc'">
            <button type="button" class="btn-close btn-close-white position-absolute end-0 top-0 m-3"
                (click)="closeModal()"></button>

            <div class="position-relative d-inline-block mb-3">
                <div class="avatar-wrapper position-relative">
                    <img [src]="previewAvatar || user.avatar"
                        class="rounded-circle avatar-lg img-thumbnail shadow cursor-pointer border-3"
                        [style.border-color]="'rgba(255,255,255,0.3)'" (click)="isCurrentUser && avatarInput.click()"
                        onerror="this.src='/assets/user.jpg'">
                    <div class="avatar-edit-overlay" *ngIf="isCurrentUser" (click)="avatarInput.click()">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                </div>
                <input type="file" #avatarInput class="d-none" (change)="onAvatarChange($event)" accept="image/*">
                </div>

            <h4 class="mb-1 text-white fw-bold">{{ user.username }}</h4>
            <p class="mb-0 text-white-50">{{ user.email }}</p>
            
            <div class="status-badge mt-2" *ngIf="!isEditing || !isCurrentUser">
                <span class="badge rounded-pill shadow-sm" [ngClass]="{
                                        'bg-success': user.status === 'Available',
                                        'bg-warning': user.status === 'Away',
                                        'bg-danger': user.status === 'Busy'
                                      }">
                    <i class="fa-solid fa-circle me-1" style="font-size: 8px;"></i> {{ user.status || 'Available' }}
                </span>
            </div>
            </div>

        <div class="p-4 bg-white rounded-top-5 shadow-lg position-relative"
            style="margin-top: -30px; z-index: 1; border-radius: 2rem 2rem 0 0;">
            <!-- Loading Overlay -->
            <div class="loading-overlay d-flex align-items-center justify-content-center" *ngIf="isLoading">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
        
            <!-- Profile Info -->
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="text-uppercase font-size-12 text-muted fw-bold mb-0 letter-spacing-1">About / Bio</h6>
                    <button class="btn btn-sm" [ngClass]="isEditing ? 'btn-soft-danger' : 'btn-soft-primary'"
                        *ngIf="isCurrentUser" (click)="toggleEdit()">
                        <i class="fa-solid" [ngClass]="isEditing ? 'fa-xmark' : 'fa-pen-to-square'"></i> {{ isEditing ?
                        'Cancel'
                        : 'Edit Profile' }}
                    </button>
                </div>
        
                <div *ngIf="!isEditing" class="bio-content">
                    <p class="text-dark bg-light p-3 rounded-4 mb-0 fw-medium line-height-1_6">{{ user.bio || 'Hey there! I
                        am using Chat App.' }}</p>
                </div>
        
                <div *ngIf="isEditing && isCurrentUser" class="edit-mode-container animate__animated animate__fadeIn">
                    <div class="mb-3">
                        <label class="form-label font-size-12 fw-bold text-muted text-uppercase">Current Status</label>
                        <div class="d-flex gap-2 mb-2">
                            <button class="btn btn-sm rounded-pill px-3 flex-grow-1" [class.btn-success]="user.status === 'Available'"
                                [class.btn-outline-success]="user.status !== 'Available'" (click)="user.status = 'Available'">Available</button>
                            <button class="btn btn-sm rounded-pill px-3 flex-grow-1" [class.btn-warning]="user.status === 'Away'"
                                [class.btn-outline-warning]="user.status !== 'Away'" (click)="user.status = 'Away'">Away</button>
                            <button class="btn btn-sm rounded-pill px-3 flex-grow-1" [class.btn-danger]="user.status === 'Busy'"
                                [class.btn-outline-danger]="user.status !== 'Busy'" (click)="user.status = 'Busy'">Busy</button>
                        </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label font-size-12 fw-bold text-muted text-uppercase">Bio Description</label>
                            <textarea class="form-control rounded-3 border-light shadow-sm bg-light" rows="3" [(ngModel)]="user.bio"
                                maxlength="150" placeholder="Tell something about yourself..."></textarea>
                            <div class="text-end font-size-11 text-muted mt-1 fw-bold">{{ user.bio?.length || 0 }}/150</div>
                        </div>
                        <button class="btn btn-primary w-100 rounded-pill btn-lg shadow-primary" [disabled]="isLoading"
                            (click)="updateProfile()">
                            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                            Update Profile
                        </button>
                        </div>
                        </div>

            <!-- Shared Media (Only shown if viewing someone's profile in a private chat context) -->
            <ng-container *ngIf="conversationId && !isEditing">
                <div class="shared-media-section mt-5" *ngIf="mediaList.length > 0">
                    <div class="d-flex align-items-center mb-3">
                        <h6 class="text-uppercase font-size-12 text-muted fw-bold mb-0 flex-grow-1 letter-spacing-1">Shared Media
                        </h6>
                        <span class="badge bg-soft-primary text-primary rounded-pill">{{ mediaList.length }} items</span>
                    </div>
                    <ngx-simplebar style="max-height: 250px;">
                        <div class="shared-media-gallery">
                            <div class="row g-2">
                                <div class="col-4" *ngFor="let media of mediaList">
                                    <div class="media-thumb rounded-3 shadow-sm overflow-hidden position-relative group cursor-pointer"
                                        style="aspect-ratio: 1/1;" (click)="openMedia(media.fileUrl)">
                                        <img *ngIf="media.type === 'image'" [src]="media.fileUrl"
                                            class="w-100 h-100 object-fit-cover transition-transform">
                                        <div *ngIf="media.type !== 'image'"
                                            class="w-100 h-100 d-flex align-items-center justify-content-center bg-light-subtle border border-light">
                                            <i class="fa-solid fa-file-pdf text-danger fs-3" *ngIf="media.type === 'pdf'"></i>
                                            <i class="fa-solid fa-circle-play text-primary fs-3" *ngIf="media.type === 'video'"></i>
                                            <i class="fa-solid fa-music text-info fs-3" *ngIf="media.type === 'audio'"></i>
                                        </div>
                                        <div class="media-overlay">
                                            <i class="fa-solid fa-arrow-up-right-from-square text-white"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </ngx-simplebar>
                    </div>
                <div *ngIf="mediaList.length === 0" class="empty-media text-center py-4 bg-light rounded-4 border-dashed border-2">
                    <i class="fa-solid fa-images text-muted mb-2 opacity-50 fs-2"></i>
                    <p class="text-muted font-size-13 mb-0">No shared media yet in this chat</p>
                </div>
            </ng-container>
        </div>
    </ng-container>
    
    <!-- Global Loading State -->
    <div *ngIf="!user && isLoading" class="p-5 text-center">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Loading profile...</p>
    </div>
</div>
