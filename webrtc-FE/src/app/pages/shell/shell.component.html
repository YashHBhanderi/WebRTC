<a class="skip-link visually-hidden-focusable" href="#main-content">Skip to content</a>

<div class="shell" [class.shell--collapsed]="collapsed" [class.shell--immersive]="shellUi.immersive$ | async">
  <!-- ============================================================ TOP BAR -->
  <header class="topbar">
    <!-- In the navigation column, centred on the same line as the navigation icons -->
    <span class="topbar__rail d-none d-md-flex">
      <button type="button" class="topbar__toggle" (click)="toggleCollapsed()"
              [attr.aria-label]="collapsed ? 'Expand navigation' : 'Collapse navigation'" [attr.aria-expanded]="!collapsed"
              [title]="collapsed ? 'Expand navigation' : 'Collapse navigation'" aria-controls="app-rail">
        <i class="ti ti-menu-2" aria-hidden="true"></i>
      </button>
    </span>

    <app-global-search></app-global-search>
    <span class="topbar__spacer d-md-none" aria-hidden="true"></span>

    <a class="topbar__icon" routerLink="/settings" routerLinkActive="topbar__icon--active" aria-label="Settings" title="Settings">
      <i class="ti ti-settings" aria-hidden="true"></i>
    </a>
    <span class="topbar__divider" aria-hidden="true"></span>

    <div ngbDropdown placement="bottom-end" class="d-inline-block">
      <button type="button" class="topbar__me" ngbDropdownToggle aria-label="Account menu" [title]="(me?.username || '') + ' (' + myStatusLabel + ')'">
        <app-avatar [src]="me?.avatar" [name]="me?.username || ''" [size]="28" [presence]="myPresenceKey"></app-avatar>
      </button>
      <div ngbDropdownMenu class="app-menu">
        <div class="menu-user">
          <div class="menu-user__name">{{ me?.username }}</div>
          <div class="menu-user__status">{{ myStatusLabel }}<span *ngIf="presence.mine.statusMessage"> · {{ presence.mine.statusMessage }}</span></div>
        </div>
        <div class="dropdown-divider"></div>
        <button ngbDropdownItem type="button" *ngFor="let opt of statusOptions" (click)="chooseStatus(opt.value)"
                [attr.aria-pressed]="presence.mine.status === opt.value">
          <span class="status-dot status-dot--{{ opt.key }}" aria-hidden="true"></span>{{ opt.label }}
          <i class="ti ti-check ms-auto" *ngIf="presence.mine.status === opt.value" aria-hidden="true"></i>
        </button>
        <button ngbDropdownItem type="button" (click)="openStatusMessage()">
          <i class="ti ti-message" aria-hidden="true"></i>{{ presence.mine.statusMessage ? 'Edit status message' : 'Set status message' }}
        </button>
        <div class="dropdown-divider"></div>
        <a ngbDropdownItem routerLink="/profile"><i class="ti ti-user" aria-hidden="true"></i>Profile</a>
        <a ngbDropdownItem routerLink="/saved"><i class="ti ti-bookmark" aria-hidden="true"></i>Saved messages</a>
        <a ngbDropdownItem routerLink="/settings"><i class="ti ti-settings" aria-hidden="true"></i>Settings</a>
        <div class="dropdown-divider"></div>
        <button ngbDropdownItem type="button" class="text-danger" (click)="signOut()">
          <i class="ti ti-logout" aria-hidden="true"></i>Sign out
        </button>
      </div>
    </div>
  </header>

  <!-- ============================================================ NAV RAIL -->
  <nav class="rail" id="app-rail" aria-label="Main">
    <ul class="rail__list">
      <li *ngFor="let item of primaryNav; trackBy: trackByPath">
        <a class="rail__item" [routerLink]="item.path" routerLinkActive="rail__item--active"
           #rla="routerLinkActive" [attr.aria-current]="rla.isActive ? 'page' : null"
           [attr.aria-label]="item.label"
           [attr.title]="collapsed ? null : item.label + ' (Alt+' + item.shortcut + ')'"
           [ngbTooltip]="item.label + ' (Alt+' + item.shortcut + ')'" [disableTooltip]="!collapsed"
           placement="end" container="body" [openDelay]="150">
          <span class="rail__tile" aria-hidden="true">
            <i class="ti {{ item.icon }}" [class.ti-fill]="rla.isActive"></i>
            <span class="count-badge count-badge--rail" *ngIf="item.path === '/activity' && (notifications.unread$ | async) as n">{{ n > 99 ? '99+' : n }}</span>
            <span class="count-badge count-badge--rail" *ngIf="item.path === '/chat' && (notifications.unreadChats$ | async) as n">{{ n > 99 ? '99+' : n }}</span>
          </span>
          <span class="rail__label">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- ============================================================ CONTENT -->
  <main class="content" id="main-content" tabindex="-1">
    <div class="content__page">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<!-- Incoming call -->
<app-incoming-call
  *ngIf="calls.incomingCall"
  [call]="calls.incomingCall"
  (accept)="calls.acceptIncoming()"
  (decline)="calls.declineIncoming()"
></app-incoming-call>

<!-- Active call (full screen or minimized; survives navigation) -->
<app-group-call
  *ngIf="calls.activeCall"
  [launch]="calls.activeCall"
  [minimized]="calls.minimized"
  (minimizedChange)="calls.setMinimized($event)"
  (closed)="calls.closed()"
></app-group-call>

<ng-template #statusMessageTpl let-modal>
  <div class="modal-header">
    <h2 class="modal-title h5" id="status-message-title">Status message</h2>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>
  <form (ngSubmit)="saveStatusMessage()">
    <div class="modal-body">
      <label for="status-message" class="form-label">What do you want people to know?</label>
      <input id="status-message" class="form-control" name="statusMessage" maxlength="140" [(ngModel)]="statusDraft"
             placeholder="e.g. In a workshop until 3pm" autocomplete="off" ngbAutofocus />
      <div class="form-text">{{ statusDraft.length }}/140 · Shown next to your name in chats and search.</div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-light me-auto" *ngIf="presence.mine.statusMessage" (click)="saveStatusMessage(true)" [disabled]="savingStatus">Clear</button>
      <button type="button" class="btn btn-light" (click)="modal.dismiss()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="savingStatus">Save</button>
    </div>
  </form>
</ng-template>
