<div class="modal-header">
  <h2 class="modal-title h5" id="confirm-dialog-title">{{title}}</h2>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()" *ngIf="showCloseBtn"></button>
</div>
<div class="modal-body" *ngIf="content">{{content}}</div>
<div class="modal-footer">
  <button type="button" class="btn btn-light" (click)="activeModal.dismiss()"
    *ngIf="cancelBtn">{{cancelBtn}}</button>
  <button type="button" class="btn btn-{{okType}}" (click)="activeModal.close()" ngbAutofocus>{{okBtn}}</button>
</div>
