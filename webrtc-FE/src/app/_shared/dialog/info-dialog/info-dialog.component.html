<div class="modal-header">
  <h4 class="modal-title">{{title}}</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
    <i aria-hidden="true" class="ki ki-close"></i>
  </button>
</div>
<div class="modal-body">
  <ng-container *ngIf="isObjectContent; then objectContentTpl else stringContentTpl"></ng-container>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-{{okType}}" (click)="activeModal.close()">{{okBtn}}</button>
</div>

<ng-template #objectContentTpl>
  <pre><code>{{ content | json }}</code></pre>
</ng-template>

<ng-template #stringContentTpl>
  <p [innerHTML]="content "></p>
</ng-template>
